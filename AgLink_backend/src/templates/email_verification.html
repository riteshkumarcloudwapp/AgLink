<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:#f4f4f4; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center">

      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; margin-top:40px; border-radius:10px; overflow:hidden;">

        <!-- Header -->
        <tr>
          <td style="background:#1e72b7; padding:20px; text-align:center; color:#ffffff; font-size:24px; font-weight:bold;">
            AgLink
          </td>
        </tr>

        <!-- Content -->
        <tr>
          <td style="padding:30px;">

            <p style="font-size:18px; font-weight:bold;">Hello, {{name}}!</p>

            <p style="font-size:14px; color:#555;">
              Welcome to <b>AgLink</b>! We're excited to have you join us.
            </p>

            <!-- OTP Box -->
            <table width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0;">
              <tr>
                <td align="center" style="background:#f2f2f2; padding:20px; border-radius:8px;">
                  <p style="margin:0; font-size:14px; color:#777;">Your Verification Code</p>
                  <p style="font-size:32px; letter-spacing:5px; font-weight:bold; color:#1e72b7; margin:10px 0;">
                    {{otp}}
                  </p>
                </td>
              </tr>
            </table>

            <!-- Info -->
            <p style="font-size:13px; color:#777;">
              ⏰ This code will expire in <b>15 minutes</b>.
            </p>

            <hr style="margin:20px 0; border:none; border-top:1px solid #ddd;" />

            <p style="font-size:13px; color:#999;">
              Need help? Contact our support team anytime.
            </p>

          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
